name: MacOrganizer
options:
  bundleIdPrefix: com.roshanshrestha
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  OrganizerCore:
    path: OrganizerCore

targets:
  MacOrganizer:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MacOrganizer
    dependencies:
      - package: OrganizerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roshanshrestha.macorganizer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Mac Organizer
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Mac Organizer"
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        LSApplicationSecondaryPersistentDataOnUninstall: NO
    entitlements:
      path: Generated/MacOrganizer.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.desktop-folder.read-write: true
        com.apple.security.files.documents-folder.read-write: true

  MacOrganizerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MacOrganizerTests
    dependencies:
      - target: MacOrganizer
      - package: OrganizerCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MacOrganizer:
    build:
      targets:
        MacOrganizer: all
        MacOrganizerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacOrganizerTests
